<script id="diamond-scout-core">
'use strict';
(() => {
 const positions=['LF','CF','RF','3B','SS','P','2B','1B','C'];
 const zoneToPosition={left_field:'LF',left_field_line:'LF',left_center:'LF',center_field:'CF',right_center:'RF',right_field:'RF',right_field_line:'RF',third_base_area:'3B',shortstop_area:'SS',pitcher_area:'P',second_base_area:'2B',first_base_area:'1B',catcher_area:'C'};
 const positionToZone={LF:'left_field',CF:'center_field',RF:'right_field','3B':'third_base_area',SS:'shortstop_area',P:'pitcher_area','2B':'second_base_area','1B':'first_base_area',C:'catcher_area'};
 const names={LF:'Left fielder',CF:'Center fielder',RF:'Right fielder','3B':'Third baseman',SS:'Shortstop',P:'Pitcher','2B':'Second baseman','1B':'First baseman',C:'Catcher'};
 const resultNames={single:'Single',double:'Double',triple:'Triple',home_run:'Home run',walk:'Walk',hit_by_pitch:'Hit by pitch',ground_out:'Ground out',fly_out:'Fly out',line_out:'Line out',pop_out:'Pop out',strikeout_swinging:'Strikeout swinging',strikeout_looking:'Strikeout looking',strikeout_foul_tip:'Foul-tip strikeout',infield_fly:'Infield fly (out)',reached_on_error:'Reached on error',double_play:'Double play',catchers_interference:'Catcher’s interference',fielders_choice:'Fielder’s choice',fielders_choice_double_play:'Fielder’s choice double play',sacrifice_fly:'Sacrifice fly',sacrifice_bunt:'Sacrifice bunt',dropped_third_strike:'Dropped third strike',foul_out:'Foul catch (out)',fair_contact:'Fair contact only'};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pretty=s=>resultNames[s]||String(s||'Unknown').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
 const pct=(n,d)=>{if(!d)return '—';const percent=n/d*100;return (percent>0&&percent<.5?Number(percent.toPrecision(1)):Math.round(percent))+'%';};
 const hit=pa=>['single','double','triple','home_run'].includes(pa.result);
 const formatCount=c=>c?c.balls+'–'+c.strikes:'Not recorded';
 const gameWhen=g=>{
  let text=g.date||'Date not provided';
  if(g.start_time){const [h,m]=g.start_time.split(':');text+=' · '+(Number(h)%12||12)+':'+m+' '+(Number(h)<12?'AM':'PM');}
  return text;
 };
 const foulZones={left_foul_territory:'Left foul territory',right_foul_territory:'Right foul territory',behind_home_plate:'Behind home plate'};
 function validateDataPath(path){
  if(typeof path!=='string'||!path.endsWith('.json')||/[:\\%?#\u0000-\u001f\u007f]/.test(path)||path.split('/').some(part=>!part||part==='.'||part==='..'))throw Error('JSON paths must be relative files inside this project, such as data/shockers-14u.json.');
  return path;
 }
 function validateManifest(m){if(m?.schema_version!==1||!Array.isArray(m.teams)||!m.teams.length)throw Error('The team list must use schema_version 1 and contain at least one team.');const ids=new Set();for(const t of m.teams){if(!t.id||!t.name||typeof t.data_file!=='string'||ids.has(t.id))throw Error('Each team needs a unique ID, name and data_file.');validateDataPath(t.data_file);ids.add(t.id);}return m;}
 const reachResults=new Set(['single','double','triple','walk','hit_by_pitch','reached_on_error','fielders_choice','fielders_choice_double_play','catchers_interference']);
 const noReachResults=new Set(['home_run','ground_out','fly_out','line_out','pop_out','strikeout_swinging','strikeout_looking','strikeout_foul_tip','infield_fly','double_play','sacrifice_fly','sacrifice_bunt','foul_out']);
 function onBaseStatus(pa){
  if(pa.status!=='complete')return false;
  if(pa.reached_base!==undefined)return pa.reached_base;
  return reachResults.has(pa.result)?true:noReachResults.has(pa.result)?false:null;
 }
 function validateData(d){
  if(d?.schema_version!==1||!d.team?.id||!d.team?.name||!Array.isArray(d.players)||!Array.isArray(d.games)||!Array.isArray(d.plate_appearances))throw Error('Team data must use schema_version 1 and include team, players, games and plate_appearances.');
  const unique=(xs,label)=>{const set=new Set();for(const x of xs){if(!x.id||set.has(x.id))throw Error('Missing or duplicate '+label+' ID.');set.add(x.id);}return set;};
  const players=unique(d.players,'player'),games=unique(d.games,'game');unique(d.plate_appearances,'plate appearance');
  for(const p of d.players)if(!p.name)throw Error('A player is missing a name.');
  for(const g of d.games){if(typeof g.opponent!=='string'||!g.opponent.trim())throw Error('A game is missing its opponent.');if(g.date!=null&&(!/^\d{4}-\d{2}-\d{2}$/.test(g.date)||!Number.isFinite(Date.parse(g.date))||new Date(g.date).toISOString().slice(0,10)!==g.date))throw Error('Game date must be a real YYYY-MM-DD date or null.');if(g.start_time!=null&&(typeof g.start_time!=='string'||!/^([01]\d|2[0-3]):[0-5]\d$/.test(g.start_time)))throw Error('Game start_time must be HH:MM in 24-hour format or null.');}
  const types=['ground_ball','fly_ball','line_drive','bunt','unknown'];
  for(const pa of d.plate_appearances){
   if(!players.has(pa.batter_id)||!games.has(pa.game_id)||!Number.isInteger(pa.inning)||pa.inning<1||!['top','bottom'].includes(pa.half)||!['complete','incomplete'].includes(pa.status)||!Array.isArray(pa.pitches))throw Error('Invalid plate appearance: '+pa.id);
   if(pa.result==='catchers_interference'&&pa.batted_ball)throw Error('Catcher interference has no fair batted ball: '+pa.id);
   if(pa.reached_base!==undefined&&pa.reached_base!==null&&typeof pa.reached_base!=='boolean')throw Error('reached_base must be true, false or null: '+pa.id);
   if(pa.result==='home_run'&&pa.reached_base===true)throw Error('Home runs are excluded from on-base visits: '+pa.id);
   for(let i=0;i<pa.pitches.length;i++){const p=pa.pitches[i],c=p.count_before;if(typeof p.outcome!=='string'||p.sequence!==i+1||(c!=null&&(!Number.isInteger(c.balls)||c.balls<0||c.balls>3||!Number.isInteger(c.strikes)||c.strikes<0||c.strikes>2)))throw Error('Invalid pitch sequence or count in '+pa.id);}
   if(pa.batted_ball){const b=pa.batted_ball,l=b.location;if(!types.includes(b.contact_type)||!l||!['fielder_zone','described_area','unknown'].includes(l.precision))throw Error('Invalid contact location in '+pa.id);if(l.zone&&!zoneToPosition[l.zone])throw Error('Unsupported map zone: '+l.zone);if(b.fielding_position&&!positions.includes(b.fielding_position))throw Error('Unsupported fielding position.');if(l.depth&&!['shallow','deep'].includes(l.depth))throw Error('Depth must be shallow, deep or null.');if(l.precision==='fielder_zone'&&l.zone&&b.fielding_position&&zoneToPosition[l.zone]!==b.fielding_position)throw Error('Zone and fielding position disagree in '+pa.id);if(l.precision==='fielder_zone'&&(l.depth||['left_field_line','left_center','right_center','right_field_line'].includes(l.zone)))throw Error('Detailed zones require described_area precision.');}
   if(pa.foul_contact){
    const b=pa.foul_contact,l=b.location;
    if(pa.batted_ball||pa.result!=='foul_out'||pa.status!=='complete'||!types.includes(b.contact_type)||!l||pa.pitches.some(p=>p.outcome==='in_play'))throw Error('A foul catch must be a completed foul_out with no fair batted ball: '+pa.id);
    if((b.fielding_position!=null&&![...positions,'C'].includes(b.fielding_position))||(l.zone!=null&&!Object.hasOwn(foulZones,l.zone))||(l.zone!=null?l.precision!=='described_area':l.precision!=='unknown')||(l.depth!=null&&!['shallow','deep'].includes(l.depth)))throw Error('Invalid foul-catch location in '+pa.id);

  $('pitching-avg').innerHTML=pitchingMetric('AVG against',s.batting.ab&&!s.batting.unclassified?(s.batting.hits/s.batting.ab).toFixed(3).replace(/^0/,''):'—',s.batting.unclassified?'Unclassified results':s.batting.ab?s.batting.hits+'/'+s.batting.ab:'Unavailable');
  $('pitching-outcome-sample').textContent=s.outcomePitches+' tracked pitches';
  const outcomeLabels={ball:'Balls',called_strike:'Called strikes',swinging_strike:'Swinging strikes',foul:'Fouls',in_play:'Balls in play',foul_tip:'Foul tips',foul_out:'Foul catches',hit_by_pitch:'Hit by pitch',unknown:'Unclassified'};
  $('pitching-outcome-bars').innerHTML=s.outcomePitches?Object.entries(s.pitchOutcomes).filter(([,n])=>n>0).map(([key,n])=>'<div class="pitching-outcome-row"><span>'+e(outcomeLabels[key]||'Unclassified')+'</span><div class="track" aria-hidden="true"><div class="fill" style="width:'+n/s.outcomePitches*100+'%"></div></div><span class="num">'+n+' · '+D.pct(n,s.outcomePitches)+'</span></div>').join(''):'<p class="note">No tracked pitch outcomes available.</p>';


 }
 function render(){if(!data)return;renderSortPicker();renderBatterPicker();saveSelection();const pas=selected(),b=D.battingSummary(pas),gameCount=new Set(pas.map(p=>p.game_id)).size;
  $('page-title').textContent=data.team.name;$('page-subtitle').textContent=state.batter==='all'?'Team history':playerName(state.batter);

  $('app').dataset.view=state.view;
  const small=b.complete>0&&D.summarize(pas).n<10;$('sample-label').textContent=!b.complete?'No completed PAs':small?'Very small sample':'Recorded history';$('sample-label').className='badge'+(small?' sample-warning':'');$('sample-label').hidden=b.complete>0&&!small;
  $('coverage-note').textContent=data.games.length+' recorded games · '+data.plate_appearances.length+' plate appearances'+(data.games.some(g=>!g.date)?' · some dates unknown':'');
  const game=gameSelectionCaption();
  $('filter-context').textContent=game+(state.view==='scout'?(state.type==='all'?'':' · '+D.pretty(state.type)):state.view==='pitching'?' · Pitching summaries':' · All plate appearances');
  $('filter-context').setAttribute('title',$('filter-context').textContent);

 function switchView(view){
  if(state.view!==view)closeMetricDetails();
  state.view=view;
  for(const b of document.querySelectorAll('[data-view]')){const active=b.dataset.view===view;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;}
  for(const v of ['scout','pitching'])$('view-'+v).hidden=v!==view;
  $('contact-filter').hidden=view!=='scout';$('batter-header').hidden=view==='pitching';render();
  window.scrollTo({top:0,left:0,behavior:'instant'});
 }
 async function fetchJson(path){
  D.validateDataPath(path);
  const base=new URL('./',location.href),url=new URL(path,base);
  if(url.origin!==base.origin||!url.pathname.startsWith(base.pathname))throw Error('JSON files must be inside this project.');
  const r=await fetch(url,{cache:'no-store',redirect:'error'});
  if(!r.ok)throw Error('Could not load '+path+' (HTTP '+r.status+').');
  return r.json();
 }
 async function loadTeam(id,restoreBatter='all',restoreGames='all'){
  const generation=++loadGeneration;status('Loading team history…');$('app').hidden=true;
  try{
   const t=manifest.teams.find(t=>t.id===id);if(!t)throw Error('Unknown team selection.');
   const next=cache.get(id)||D.validateData(await fetchJson(t.data_file));
   if(next.team.id!==id)throw Error('The data file’s team ID does not match the team list.');
   if(generation!==loadGeneration)return;
   cache.set(id,next);data=next;populateFilters();state.batter=data.players.some(p=>p.id===restoreBatter)?restoreBatter:'all';$('batter-select').value=state.batter;
   if(Array.isArray(restoreGames)){const valid=data.games.filter(g=>restoreGames.includes(g.id)).map(g=>g.id);state.game=valid.length===data.games.length?'all':(valid.length||!restoreGames.length?valid:'all');}
   renderGamePicker();$('status').hidden=true;$('app').hidden=false;render();
  }catch(err){if(generation===loadGeneration){
   if(data){$('app').hidden=false;$('team-select').value=data.team.id;}
   status(err.message+(data?' Still showing '+data.team.name+'. Select another team or refresh the page.':' Check the team JSON file in this project, then refresh the page.'),true);
  }}
 }
 function setManifest(m){manifest=D.validateManifest(m);$('team-select').innerHTML=manifest.teams.map(t=>'<option value="'+e(t.id)+'">'+e(t.name)+'</option>').join('');}
 for(const id of ['quick-read','batting-stats'])$(id).addEventListener('click',event=>{

 $('pitching-tendencies').addEventListener('click',event=>{if(!event.target.closest('#pitching-first-strike-toggle'))return;pitchingFirstStrikesOpen=!pitchingFirstStrikesOpen;pitchingStrikesOpen=false;pitchingStrikeoutsOpen=false;renderPitching();$('pitching-tendencies').querySelector?.('#pitching-first-strike-toggle')?.focus();});
 $('pitcher-leaders').addEventListener('click',event=>{const button=event.target.closest('[data-pitcher]');if(!button)return;state.pitcher=button.dataset.pitcher;closeMetricDetails();render();$('pitcher-context').focus({preventScroll:true});});
 $('pitcher-select').addEventListener('change',()=>{state.pitcher=$('pitcher-select').value;closeMetricDetails();render();});

  $(kind+'-previous').addEventListener('click',()=>stepPlayer(kind,-1));

 }
 $('team-select').addEventListener('change',()=>loadTeam($('team-select').value));
 $('batter-select').addEventListener('change',()=>{state.batter=$('batter-select').value;closeMetricDetails();render();});
 $('game-select').addEventListener('change',event=>{
  const id=event.target.dataset.gameId;if(!id||!data.games.some(g=>g.id===id))return;

 $('player-sort-select').addEventListener('change',()=>{const key=$('player-sort-select').value;if(!sortOptions[state.view].some(([value])=>value===key))return;state.sorts[state.view]=key;const hitting=state.view==='scout',players=hitting?batterRoster().players:pitcherRoster();state[hitting?'batter':'pitcher']=players[0]?.id||'all';closeMetricDetails();render();});
 $('contact-select').addEventListener('change',()=>{state.type=$('contact-select').value;render();});
 $('filters-done').addEventListener('click',()=>{$('filter-panel').hidden=true;$('filter-toggle').setAttribute('aria-expanded','false');$('filter-toggle').focus();});
 $('filter-toggle').addEventListener('click',()=>{const open=$('filter-panel').hidden;$('filter-panel').hidden=!open;$('filter-toggle').setAttribute('aria-expanded',String(open));});
 $('view-navigation').hidden=false;
 const tabs=[...document.querySelectorAll('[data-view]')];
 for(const [i,btn]of tabs.entries()){
  btn.hidden=false;btn.disabled=false;
  btn.tabIndex=i===0?0:-1;
  btn.addEventListener('click',()=>switchView(btn.dataset.view));
  btn.addEventListener('keydown',event=>{let j;if(event.key==='ArrowRight')j=(i+1)%tabs.length;else if(event.key==='ArrowLeft')j=(i+tabs.length-1)%tabs.length;else if(event.key==='Home')j=0;else if(event.key==='End')j=tabs.length-1;else return;event.preventDefault();const visible=tabs.filter(t=>!t.hidden),index=visible.indexOf(btn);j=event.key==='Home'?0:event.key==='End'?visible.length-1:(index+(event.key==='ArrowRight'?1:-1)+visible.length)%visible.length;visible[j].focus();switchView(visible[j].dataset.view);});
 }
 let narrow=window.innerWidth<560;
 window.addEventListener('resize',()=>{const next=window.innerWidth<560;if(next!==narrow){narrow=next;if(data){renderScout(selected());}}});
 async function initializeData(){
  if(location.protocol==='file:'){
   status('Automatic JSON loading needs a local web preview. From this project directory, run python3 -m http.server 8000 --bind 127.0.0.1, then open http://127.0.0.1:8000. The app reads only teams.json and its listed team files.',true);
   return;
  }
  const generation=++loadGeneration;status('Loading team list…');
  try{
   const nextManifest=D.validateManifest(await fetchJson('teams.json'));
   if(generation!==loadGeneration)return;
   const saved=readSelection();
   for(const view of ['scout','pitching'])if(sortOptions[view].some(([value])=>value===saved?.sorts?.[view]))state.sorts[view]=saved.sorts[view];
   const id=nextManifest.teams.some(t=>t.id===saved?.team)?saved.team:nextManifest.teams[0].id;
   cache.clear();setManifest(nextManifest);$('team-select').value=id;await loadTeam(id,saved?.team===id?saved.batter:'all',saved?.team===id?saved.games:'all');
  }catch(err){if(generation===loadGeneration)status(err.message+' Check teams.json beside index.html and its listed team files, then refresh the page.',true);}
 }
 let nextRelease=null,releaseCheckRunning=false,lastReleaseCheck=0;
 async function checkRelease(){
  if(location.protocol==='file:'||releaseCheckRunning||Date.now()-lastReleaseCheck<30000)return;
  releaseCheckRunning=true;lastReleaseCheck=Date.now();
  try{
   const result=await fetchJson('version.json');
   if(typeof result.version==='string'&&/^[a-f0-9]{16}$/.test(result.version)){
    nextRelease=result.version===releaseVersion?null:result.version;
    $('release-update').hidden=!nextRelease;
   }
  }catch{/* Offline or an older deployment: leave the current page usable. */}
  finally{releaseCheckRunning=false;}
 }
 $('release-refresh').addEventListener('click',()=>{
  if(!nextRelease)return;

  const url=new URL(location.href);url.searchParams.set('release',nextRelease);
  location.replace(url.href);
 });
 window.addEventListener('pageshow',()=>checkRelease());
 document.addEventListener?.('visibilitychange',()=>{if(document.visibilityState==='visible')checkRelease();});
 checkRelease();
 // Standalone iOS has no browser refresh toolbar. Keep this gesture out of normal browsers.
 function installPullRefresh(){
  if(!(window.navigator?.standalone===true||matchMedia('(display-mode: standalone)').matches))return;
  let start=null,armed=false,reloading=false;
  const hint=$('pull-refresh'),reset=()=>{start=null;armed=false;hint.hidden=true;};
  window.addEventListener('touchstart',event=>{
   if(reloading)return;
   reset();
   if(event.touches.length!==1||(window.scrollY||0)>0)return;
   const target=event.target;
   if(target.closest?.('button,select,input,textarea,a,summary,nav'))return;
   // Let independently scrollable controls, such as the game list, handle their own gestures.
   for(let node=target;node&&node!==document.body;node=node.parentElement)if(node.scrollHeight>node.clientHeight+1&&/auto|scroll/.test(getComputedStyle(node).overflowY))return;
   start={x:event.touches[0].clientX,y:event.touches[0].clientY};
  },{passive:true});
  window.addEventListener('touchmove',event=>{
   if(!start||reloading)return;
   if(event.touches.length!==1){reset();return;}
   const dx=event.touches[0].clientX-start.x,dy=event.touches[0].clientY-start.y;
   if(dy<0||Math.abs(dx)>40||(window.scrollY||0)>0){reset();return;}
   if(dy<12)return;
   if(!event.cancelable){reset();return;}
   event.preventDefault();armed=dy>=100;
   hint.hidden=false;hint.textContent=armed?'Release to refresh':'Pull to refresh';
  },{passive:false});
  window.addEventListener('touchend',()=>{
   if(!start||reloading)return;
   if(!armed){reset();return;}
   start=null;reloading=true;hint.hidden=false;hint.textContent='Refreshing…';location.reload();
  },{passive:true});
  window.addEventListener('touchcancel',()=>{if(!reloading)reset();},{passive:true});
 }
 installPullRefresh();
 initializeData();
})();
